<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grandma's Alphabet Book</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alphabet Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>

<header>
    <h1>📕 Grandma's Alphabet Book</h1>

    <input type="text" id="searchBox" placeholder="Search all pages...">

    <div class="backup-controls">
        <button id="exportBtn">Export Backup</button>

        <input type="file" id="importFile" accept=".json">

        <button id="importBtn">Import Backup</button>
    </div>
</header>

<div class="container">

    <div class="page">
        <h2 id="currentLetter">A</h2>

        <div id="editor" contenteditable="true" class="editor"></div>
    </div>

    <div class="tabs" id="tabs"></div>

</div>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
